name: WebdriverIO + Docker image

on:
  push:
    branches:
      - LQB-25
  pull_request:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: docker build -t wdio-allure-tests .

      - name: Run WDIO tests in Docker
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: docker run --name wdio-runner wdio-allure-tests || true

      - name: Copy Allure results
        run: |
          docker cp wdio-runner:/usr/src/app/allure-results ./allure-results || true

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate ./allure-results --clean -o ./allure-report

      - name: Deploy Allure report to test-reports branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT}}
          publish_branch: test-reports
          publish_dir: allure-report